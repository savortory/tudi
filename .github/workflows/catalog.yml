name: Device catalog
on:
  pull_request:
  push:
    branches: [main]
    tags: ['devices-v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.23.0
      - name: Validate catalog
        shell: bash
        run: |
          prior=$(git describe --tags --match 'devices-v*' --exclude "$GITHUB_REF_NAME" --abbrev=0 HEAD 2>/dev/null || true)
          if [[ -n "$prior" ]]; then
            mkdir -p "$RUNNER_TEMP/prior/devices"
            git show "$prior:devices/manifest.json" > "$RUNNER_TEMP/prior/devices/manifest.json"
            python devices/tools/validate.py --previous "$RUNNER_TEMP/prior/devices"
          else
            python devices/tools/validate.py
          fi
  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/devices-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish catalog release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Device catalog $GITHUB_REF_NAME" devices/manifest.json
